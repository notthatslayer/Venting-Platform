   <center> 
     <h2>Get Help by contacting us :)</h2>

    <form id="contact-form">
      &nbsp;&nbsp;<label for="name">Name:</label>
      <input type="text" required style="padding: 10px; border: 2px solid #007BFF;
      border-radius: 8px; font-size: 16px; transition: border-color 0.3s ease-in-out;" 
      placeholder="Enter your name here" onfocus="this.style.borderColor='#0056b3';" 
      onblur="this.style.borderColor='#007BFF';">
      <br><br>
      

      &nbsp;&nbsp;<label for="email">Email:</label>
      <input type="email" attern="[^ @]*@[^ @]*" style="padding: 10px; border: 2px solid #007BFF;
      border-radius: 8px; font-size: 16px; transition: border-color 0.3s ease-in-out;" 
      placeholder="Email, Please :)" onfocus="this.style.borderColor='#0056b3';" 
      onblur="this.style.borderColor='#007BFF';">
      <br><br>
      
      &nbsp;&nbsp;<label for="message">Message:</label>
      <input type="text" style="padding: 10px; border: 2px solid #007BFF;
      border-radius: 8px; font-size: 16px; transition: border-color 0.3s ease-in-out;" 
      placeholder="Wsg?" onfocus="this.style.borderColor='#0056b3';" 
      onblur="this.style.borderColor='#007BFF';">
      <br> <br>
      <button style="padding: 10px 20px;
            border-radius: 20px;
            border: none;
            background-color: black;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            margin-left: 10px; 
            margin-top: 10px;"
            id="ventButton">Submit</button>
